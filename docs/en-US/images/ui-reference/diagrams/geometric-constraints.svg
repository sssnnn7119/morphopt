<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img"><title>Geometric constraints</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426484"/></marker></defs>
<rect width="1200" height="610" rx="16" fill="#f5f8fc"/>
<text x="32" y="42" font-family="Arial, sans-serif" font-size="24" fill="#15324d" font-weight="600">Geometric constraints</text>
<rect x="35" y="90" width="545" height="220" rx="12" fill="#ffffff" stroke="#b0c6db" stroke-width="1.5"/>
<text x="53" y="120" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Cylinder: radial and axial bounds</text>
<rect x="620" y="90" width="545" height="220" rx="12" fill="#ffffff" stroke="#b0c6db" stroke-width="1.5"/>
<text x="638" y="120" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">MinRadius: distance to the Z axis</text>
<rect x="35" y="335" width="545" height="220" rx="12" fill="#ffffff" stroke="#b0c6db" stroke-width="1.5"/>
<text x="53" y="365" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Distance: boundary separation</text>
<rect x="620" y="335" width="545" height="220" rx="12" fill="#ffffff" stroke="#b0c6db" stroke-width="1.5"/>
<text x="638" y="365" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Fairness: curvature and parameterization</text>
<path d="M105 155 V260 H295 V155 Z" fill="#e8f1fc" stroke="#3a79ad" stroke-width="2" stroke-dasharray="7 5"/><path d="M140 248 Q105 216 151 177 Q188 140 236 182 Q278 226 254 248 Z" fill="#a8cce9" stroke="#2c6797" stroke-width="2"/><path d="M200 140 V275" stroke="#7c8793" stroke-dasharray="5 5"/>
<text x="320" y="175" font-family="Arial, sans-serif" font-size="19" fill="#263b50" font-weight="400">r ≤ radius</text>
<text x="320" y="209" font-family="Arial, sans-serif" font-size="19" fill="#263b50" font-weight="400">bottom ≤ z ≤ height</text>
<text x="320" y="250" font-family="Arial, sans-serif" font-size="17" fill="#263b50" font-weight="400">height is the upper Z coordinate</text>
<circle cx="770" cy="207" r="70" fill="#cfe4f5" stroke="#2c6797" stroke-width="2"/><circle cx="770" cy="207" r="35" fill="#fff" stroke="#c06945" stroke-width="2" stroke-dasharray="5 4"/><circle cx="770" cy="207" r="3" fill="#333"/><path d="M770 207 H805" stroke="#c06945" stroke-width="2" marker-end="url(#arrow)"/>
<text x="870" y="175" font-family="Arial, sans-serif" font-size="19" fill="#263b50" font-weight="400">r ≥ radius</text>
<text x="870" y="212" font-family="Arial, sans-serif" font-size="17" fill="#263b50" font-weight="400">Dashed circle: minimum radius</text>
<text x="870" y="250" font-family="Arial, sans-serif" font-size="19" fill="#934b2c" font-weight="400">Measured from the Z axis</text>
<path d="M70 433 Q160 378 280 435" fill="none" stroke="#2c6797" stroke-width="4"/><path d="M70 488 Q160 433 280 490" fill="none" stroke="#51a8a0" stroke-width="4"/><path d="M165 408 V463" stroke="#426484" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="320" y="425" font-family="Arial, sans-serif" font-size="19" fill="#263b50" font-weight="400">N × N distance matrix</text>
<text x="320" y="462" font-family="Arial, sans-serif" font-size="19" fill="#263b50" font-weight="400">Indexed by surface pair</text>
<text x="320" y="502" font-family="Arial, sans-serif" font-size="17" fill="#263b50" font-weight="400">Check wall thickness after updates</text>
<path d="M655 490 L700 440 L720 470 L740 410 L770 475 L800 430 L830 475" fill="none" stroke="#c88b72" stroke-width="2"/><path d="M655 490 Q720 400 760 455 Q800 485 830 450" fill="none" stroke="#2c6797" stroke-width="4"/>
<text x="870" y="425" font-family="Arial, sans-serif" font-size="17" fill="#263b50" font-weight="400">Limits sharp bends and distortion</text>
<text x="870" y="462" font-family="Arial, sans-serif" font-size="19" fill="#263b50" font-weight="400">Uses surface quality limits</text>
<text x="870" y="502" font-family="Arial, sans-serif" font-size="17" fill="#263b50" font-weight="400">Register Fairness in the updater</text>
<text x="35" y="585" font-family="Arial, sans-serif" font-size="17" fill="#586e83" font-weight="400">Schematic of the geometry evaluated by each constraint.</text>
