<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img"><title>Geometry, material and analysis references</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426484"/></marker></defs>
<rect width="1200" height="610" rx="16" fill="#f5f8fc"/>
<text x="32" y="42" font-family="Arial, sans-serif" font-size="24" fill="#15324d" font-weight="600">Geometry, material and analysis references</text>
<rect x="40" y="95" width="290" height="124" rx="12" fill="#e5f0fc" stroke="#b0c6db" stroke-width="1.5"/>
<text x="58" y="125" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Part definition</text>
<text x="58" y="155" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Solid, mesh and boundary surfaces</text>
<text x="58" y="182" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Example: part1</text>
<rect x="445" y="95" width="310" height="124" rx="12" fill="#e5f0fc" stroke="#b0c6db" stroke-width="1.5"/>
<text x="463" y="125" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Assembly instance</text>
<text x="463" y="155" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Part, translation and rotation</text>
<text x="463" y="182" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Example: part1-1</text>
<rect x="40" y="325" width="290" height="125" rx="12" fill="#e5f0fc" stroke="#b0c6db" stroke-width="1.5"/>
<text x="58" y="355" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Material</text>
<text x="58" y="385" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Assigned to a Part or element block</text>
<text x="58" y="412" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Homogeneous or SIMP material</text>
<rect x="445" y="325" width="310" height="150" rx="12" fill="#e5f0fc" stroke="#b0c6db" stroke-width="1.5"/>
<text x="463" y="355" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Load, boundary or connection</text>
<text x="463" y="385" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Targets an instance set or RP</text>
<text x="463" y="412" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Pressure → surface set</text>
<text x="463" y="439" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Coupling / support → node set</text>
<rect x="870" y="95" width="290" height="124" rx="12" fill="#e5f0fc" stroke="#b0c6db" stroke-width="1.5"/>
<text x="888" y="125" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Reference point (RP)</text>
<text x="888" y="155" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Position and degrees of freedom</text>
<text x="888" y="182" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Coupled to the solid</text>
<rect x="870" y="325" width="290" height="150" rx="12" fill="#e5f0fc" stroke="#b0c6db" stroke-width="1.5"/>
<text x="888" y="355" font-family="Arial, sans-serif" font-size="17" fill="#154575" font-weight="600">Load case → objective / metric</text>
<text x="888" y="385" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Specifies load parameters</text>
<text x="888" y="412" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Objective reads case response</text>
<text x="888" y="439" font-family="Arial, sans-serif" font-size="15" fill="#263b50" font-weight="400">Metrics record selected responses</text>
<polyline points="330,155 445,155" fill="none" stroke="#426484" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="345" y="140" font-family="Arial, sans-serif" font-size="16" fill="#426484" font-weight="400">Place instance</text>
<polyline points="185,325 185,219" fill="none" stroke="#426484" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="202" y="281" font-family="Arial, sans-serif" font-size="16" fill="#426484" font-weight="400">Assign material</text>
<polyline points="600,219 600,325" fill="none" stroke="#426484" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="615" y="281" font-family="Arial, sans-serif" font-size="16" fill="#426484" font-weight="400">Instance and sets</text>
<polyline points="870,155 812,155 812,365 755,365" fill="none" stroke="#426484" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="815" y="275" font-family="Arial, sans-serif" font-size="16" fill="#426484" font-weight="400">Reference RP</text>
<polyline points="755,420 870,420" fill="none" stroke="#426484" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="762" y="398" font-family="Arial, sans-serif" font-size="16" fill="#426484" font-weight="400">Load parameters</text>
<text x="40" y="552" font-family="Arial, sans-serif" font-size="17" fill="#263b50" font-weight="400">Trace a response from the object and its references through load assignment and FE solution to the objective or metric.</text>
</svg>
