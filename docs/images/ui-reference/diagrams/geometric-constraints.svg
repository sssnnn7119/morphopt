<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img"><title>几何约束的作用范围</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426484"/></marker></defs>
<rect width="1200" height="610" rx="16" fill="#f5f8fc"/>
<text x="32" y="42" font-family="Noto Sans CJK SC" font-size="24" fill="#15324d" font-weight="600">几何约束的作用范围</text>
<rect x="35" y="90" width="545" height="220" rx="12" fill="#ffffff" stroke="#b0c6db" stroke-width="1.5"/>
<text x="53" y="120" font-family="Noto Sans CJK SC" font-size="21" fill="#154575" font-weight="600">Cylinder：径向上限与上下界</text>
<rect x="620" y="90" width="545" height="220" rx="12" fill="#ffffff" stroke="#b0c6db" stroke-width="1.5"/>
<text x="638" y="120" font-family="Noto Sans CJK SC" font-size="21" fill="#154575" font-weight="600">MinRadius：到 Z 轴的径向下限</text>
<rect x="35" y="335" width="545" height="220" rx="12" fill="#ffffff" stroke="#b0c6db" stroke-width="1.5"/>
<text x="53" y="365" font-family="Noto Sans CJK SC" font-size="21" fill="#154575" font-weight="600">Distance：两边界的最小间距</text>
<rect x="620" y="335" width="545" height="220" rx="12" fill="#ffffff" stroke="#b0c6db" stroke-width="1.5"/>
<text x="638" y="365" font-family="Noto Sans CJK SC" font-size="21" fill="#154575" font-weight="600">Fairness：曲率与参数化质量</text>
<path d="M105 155 V260 H295 V155 Z" fill="#e8f1fc" stroke="#3a79ad" stroke-width="2" stroke-dasharray="7 5"/><path d="M140 248 Q105 216 151 177 Q188 140 236 182 Q278 226 254 248 Z" fill="#a8cce9" stroke="#2c6797" stroke-width="2"/><path d="M200 140 V275" stroke="#7c8793" stroke-dasharray="5 5"/>
<text x="320" y="175" font-family="Noto Sans CJK SC" font-size="19" fill="#263b50" font-weight="400">r ≤ radius</text>
<text x="320" y="209" font-family="Noto Sans CJK SC" font-size="19" fill="#263b50" font-weight="400">bottom ≤ z ≤ height</text>
<text x="320" y="250" font-family="Noto Sans CJK SC" font-size="17" fill="#263b50" font-weight="400">height 是顶部 Z 坐标</text>
<circle cx="770" cy="207" r="70" fill="#cfe4f5" stroke="#2c6797" stroke-width="2"/><circle cx="770" cy="207" r="35" fill="#fff" stroke="#c06945" stroke-width="2" stroke-dasharray="5 4"/><circle cx="770" cy="207" r="3" fill="#333"/><path d="M770 207 H805" stroke="#c06945" stroke-width="2" marker-end="url(#arrow)"/>
<text x="870" y="175" font-family="Noto Sans CJK SC" font-size="19" fill="#263b50" font-weight="400">r ≥ radius</text>
<text x="870" y="212" font-family="Noto Sans CJK SC" font-size="17" fill="#263b50" font-weight="400">中心虚圆是径向下限</text>
<text x="870" y="250" font-family="Noto Sans CJK SC" font-size="19" fill="#934b2c" font-weight="400">不是局部曲率半径</text>
<path d="M70 433 Q160 378 280 435" fill="none" stroke="#2c6797" stroke-width="4"/><path d="M70 488 Q160 433 280 490" fill="none" stroke="#51a8a0" stroke-width="4"/><path d="M165 408 V463" stroke="#426484" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="320" y="425" font-family="Noto Sans CJK SC" font-size="19" fill="#263b50" font-weight="400">N × N 距离矩阵</text>
<text x="320" y="462" font-family="Noto Sans CJK SC" font-size="19" fill="#263b50" font-weight="400">按曲面索引定义</text>
<text x="320" y="502" font-family="Noto Sans CJK SC" font-size="17" fill="#263b50" font-weight="400">更新后仍需检查实际壁厚</text>
<path d="M655 490 L700 440 L720 470 L740 410 L770 475 L800 430 L830 475" fill="none" stroke="#c88b72" stroke-width="2"/><path d="M655 490 Q720 400 760 455 Q800 485 830 450" fill="none" stroke="#2c6797" stroke-width="4"/>
<text x="870" y="425" font-family="Noto Sans CJK SC" font-size="17" fill="#263b50" font-weight="400">控制局部尖锐与参数扭曲</text>
<text x="870" y="462" font-family="Noto Sans CJK SC" font-size="19" fill="#263b50" font-weight="400">采用曲面参数阈值</text>
<text x="870" y="502" font-family="Noto Sans CJK SC" font-size="17" fill="#263b50" font-weight="400">需在更新器中添加 Fairness</text>
<text x="35" y="585" font-family="Noto Sans CJK SC" font-size="17" fill="#586e83" font-weight="400">本图仅示意各接口的几何含义，不是有限元或优化结果。</text>
</svg>
