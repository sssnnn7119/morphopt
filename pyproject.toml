[project]
name = "morphopt"
version = "3.1.0"
description = "A morphing optimization framework using PyTorch and Abaqus."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.1",
    "numpy>=2.3.0",
    "pypardiso>=0.4.7",
    "pyqt6>=6.10.1",
    "pyvista>=0.46.4",
    "pyvistaqt>=0.11.3",
    "vtk>=9.5.2",
    "gmsh>=4.15.0",
    "tabulate>=0.9.0",
    "torchfea>=1.0.1",
    "cpgeo>=0.1.1",
    "imageio>=2.37.2",
]
