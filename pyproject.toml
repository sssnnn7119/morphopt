[project]
name = "morphopt"
version = "4.0.0.dev0"
description = "MorphOpt V4 optimization framework with a modular TorchFEA runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.1",
    "torchvision>=0.15.1",
    "numpy>=2.0.0",
    "pypardiso>=0.4.7",
    "pyside6>=6.8.0",
    "pyvista>=0.47.1",
    "pyvistaqt>=0.11.3",
    "vtk>=9.6.1",
    "gmsh>=4.15.0",
    "tabulate>=0.9.0",
    "imageio>=2.37.3",
    "bspmap>=1.0.3",
    "torchfea>=1.1.2",
    "trimesh>=4.11.5",
    "networkx>=3.6.1",
    "scipy>=1.17.1",
    "cpgeo>=1.0.12",
]

[project.scripts]
# console entry for the graphical UI (after `pip install morphopt`)
morphopt-ui = "morphopt.ui:run_app"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = ["-ra"]
cache_dir = "/tmp/morphopt4-pytest-cache"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that combine multiple MorphOpt subsystems",
    "slow: tests that require expensive geometry, FEA, or UI resources",
]
