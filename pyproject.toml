[project]
name = "morphopt"
version = "3.2.1"
description = "A morphing optimization framework using PyTorch and Abaqus."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.1",
    "torchvision>=0.15.1",
    "numpy>=2.0.0",
    "pypardiso>=0.4.7",
    "pyside6>=6.8.0",
    "pyvista>=0.47.1",
    "pyvistaqt>=0.11.3",
    "vtk>=9.6.1",
    "gmsh>=4.15.0",
    "tabulate>=0.9.0",
    "imageio>=2.37.3",
    "bspmap>=1.0.3",
    "torchfea>=1.1.1",
    "trimesh>=4.11.5",
    "networkx>=3.6.1",
    "scipy>=1.17.1",
    "cpgeo>=1.0.12",
]

[project.scripts]
# console entry for the graphical UI (after `pip install morphopt`)
morphopt-ui = "morphopt.ui:run_app"
